<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi página personal</title>
</head>
<body>

  <h1>Hola, soy Lucía</h1>

  <!-- PASO 1: Envuelve las palabras "Lima, Perú" con <strong> para que se vean en negrita (importante) -->
  <p>Estoy en tercero de secundaria y vivo en Lima, Perú.</p>

  <!-- PASO 2: Envuelve la palabra "dibujar" con <em> para que se vea en cursiva (énfasis) -->
  <p>Me encanta dibujar y quiero crear mis propias páginas web.</p>

  <!-- PASO 3: Envuelve las palabras "HTML y CSS" con <mark> para resaltarlas, como con un marcador amarillo -->
  <p>Esta semana estoy aprendiendo HTML y CSS.</p>

  <!-- PASO 4: Agrega una línea separadora con <hr> (no necesita etiqueta de cierre) -->

  <h2>Mi adivinanza favorita</h2>

  <!-- PASO 5: Agrega <br> al final de los 3 primeros versos para que cada verso salga en una línea nueva -->
  <p>
    Blanca por dentro,
    verde por fuera.
    Si quieres que te lo diga,
    espera.
  </p>

  <!-- PASO 6: Combina etiquetas. Haz que "¿Ya la adivinaste?" salga en negrita Y en cursiva:
       abre <strong>, luego <em>, escribe el texto y cierra primero </em> y después </strong> -->
  <p>¿Ya la adivinaste?</p>

</body>
</html>
