<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi página personal</title>
</head>
<body>

  <h1>Hola, soy Lucía</h1>

  <!-- PASO 1: <strong> pone el texto en negrita (importante) -->
  <p>Estoy en tercero de secundaria y vivo en <strong>Lima, Perú</strong>.</p>

  <!-- PASO 2: <em> pone el texto en cursiva (énfasis) -->
  <p>Me encanta <em>dibujar</em> y quiero crear mis propias páginas web.</p>

  <!-- PASO 3: <mark> resalta el texto como un marcador amarillo -->
  <p>Esta semana estoy aprendiendo <mark>HTML y CSS</mark>.</p>

  <!-- PASO 4: <hr> dibuja una línea separadora (no se cierra) -->
  <hr>

  <h2>Mi adivinanza favorita</h2>

  <!-- PASO 5: <br> corta la línea (no se cierra) -->
  <p>
    Blanca por dentro,<br>
    verde por fuera.<br>
    Si quieres que te lo diga,<br>
    espera.
  </p>

  <!-- PASO 6: una etiqueta dentro de otra; se cierra primero la última que se abrió -->
  <p><strong><em>¿Ya la adivinaste?</em></strong></p>

</body>
</html>
